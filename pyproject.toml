[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heroshots"
version = "0.2.1"
description = "Official Python SDK for the HeroShots / StudioHero platform (JWT auth)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HeroShots" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23"]

[project.urls]
Homepage = "https://heroshots.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
